{% extends "planner/base.html" %}
{% block title %}{{ product.name }} · Calendra{% endblock %}
{% block content %}
{% if not expanded %}
  <section class="card empty">
    <h2>This product has no forecast yet</h2>
    <a class="primary button-link" href="{% url 'data' %}">Build it from the sales page</a>
  </section>
{% else %}
  {% include "planner/includes/forecast_board.html" %}
{% endif %}
{% endblock %}
